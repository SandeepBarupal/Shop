<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management — Royal Fairway Admin</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar" class="admin-topbar"></header>

    <main class="admin-content">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Category Architecture</h1>
          <p class="admin-page-subtitle">Configure the 12 golf merchandise departments and mega menu navigation.</p>
        </div>

        <button class="admin-btn admin-btn-primary" onclick="openAddCategoryModal()">+ Add New Category</button>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Cover</th>
              <th>Category Name</th>
              <th>System Slug</th>
              <th>In-Stock Products</th>
              <th>Status</th>
              <th>Store Link</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add Category Modal -->
  <div id="cat-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #ffffff; width: 100%; max-width: 500px; border-radius: var(--admin-radius); padding: 32px;">
      <h3 style="font-size: 20px; margin-bottom: 16px;">Add New Category Department</h3>
      <form onsubmit="handleCreateCategory(event)">
        <div class="admin-form-group">
          <label class="admin-label">Category Name *</label>
          <input type="text" id="cat-name-input" class="admin-input" required placeholder="e.g. Golf Grips &amp; Shafts">
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Category Slug *</label>
          <input type="text" id="cat-slug-input" class="admin-input" required placeholder="e.g. grips-shafts">
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Banner Image URL *</label>
          <input type="url" id="cat-img-input" class="admin-input" required value="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=800&q=80">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="admin-btn admin-btn-outline" onclick="document.getElementById('cat-modal').style.display='none'">Cancel</button>
          <button type="submit" class="admin-btn admin-btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Store.init();
      Admin.renderSidebar('categories');
      Admin.renderTopbar();
      renderCategoriesTable();
    });

    function renderCategoriesTable() {
      const tbody = document.getElementById('categories-tbody');
      const cats = GOLF_DATABASE.categories;
      const prods = Store.getProducts();

      tbody.innerHTML = cats.map(c => {
        const count = prods.filter(p => p.category === c.id || (c.id === 'clubs' && ['drivers', 'irons', 'putters', 'clubs'].includes(p.category))).length;

        return `
          <tr>
            <td>
              <img src="${c.image}" style="width: 52px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid var(--admin-border);">
            </td>
            <td><strong>${c.name}</strong></td>
            <td><code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">${c.id}</code></td>
            <td><strong>${count} Items</strong></td>
            <td><span class="admin-badge badge-success">Active Department</span></td>
            <td>
              <a href="../category.html?cat=${c.id}" target="_blank" style="color: var(--admin-primary); font-weight: 700; text-decoration: underline;">
                View Page ↗
              </a>
            </td>
            <td>
              <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="alert('Category details updated!')">Edit</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openAddCategoryModal() {
      document.getElementById('cat-modal').style.display = 'flex';
    }

    function handleCreateCategory(e) {
      e.preventDefault();
      const name = document.getElementById('cat-name-input').value;
      const slug = document.getElementById('cat-slug-input').value;
      const img = document.getElementById('cat-img-input').value;

      GOLF_DATABASE.categories.push({ id: slug, name, image: img, count: 0 });
      document.getElementById('cat-modal').style.display = 'none';
      renderCategoriesTable();
      alert(`Category "${name}" added to architecture!`);
    }
  </script>
</body>
</html>
