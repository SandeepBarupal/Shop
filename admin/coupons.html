<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupon Management — Royal Fairway Admin</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar" class="admin-topbar"></header>

    <main class="admin-content">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Coupons &amp; Member Promotions</h1>
          <p class="admin-page-subtitle">Configure promo codes, trade-in bonus vouchers, and discount rules.</p>
        </div>

        <button class="admin-btn admin-btn-primary" onclick="openAddCouponModal()">+ Create New Promo Code</button>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Promo Code</th>
              <th>Discount Type</th>
              <th>Value</th>
              <th>Min. Order (₹)</th>
              <th>Usage Count</th>
              <th>Expiry</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="coupons-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add Coupon Modal -->
  <div id="coupon-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #ffffff; width: 100%; max-width: 500px; border-radius: var(--admin-radius); padding: 32px;">
      <h3 style="font-size: 20px; margin-bottom: 16px;">Create Promo Code</h3>
      <form onsubmit="handleCreateCoupon(event)">
        <div class="admin-form-group">
          <label class="admin-label">Coupon Code (Uppercase) *</label>
          <input type="text" id="cpn-code" class="admin-input" required placeholder="e.g. MASTERS20" style="text-transform: uppercase;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="admin-form-group">
            <label class="admin-label">Discount Type *</label>
            <select id="cpn-type" class="admin-select">
              <option value="percent">Percentage (%)</option>
              <option value="fixed">Fixed Amount (₹)</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label class="admin-label">Discount Value *</label>
            <input type="number" id="cpn-val" class="admin-input" required placeholder="10">
          </div>
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Minimum Order Value (₹)</label>
          <input type="number" id="cpn-min" class="admin-input" value="4999">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="admin-btn admin-btn-outline" onclick="document.getElementById('coupon-modal').style.display='none'">Cancel</button>
          <button type="submit" class="admin-btn admin-btn-primary">Activate Coupon</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="admin.js"></script>
  <script>
    const INITIAL_COUPONS = [
      { code: 'GOLF10', type: 'percent', val: 10, min: 4999, uses: 142, expiry: '31 Dec 2026', status: 'Active' },
      { code: 'FAIRWAY500', type: 'fixed', val: 500, min: 2500, uses: 89, expiry: '31 Dec 2026', status: 'Active' },
      { code: 'BIRDIE15', type: 'percent', val: 15, min: 15000, uses: 34, expiry: '30 Nov 2026', status: 'Active' },
      { code: 'TRADEIN1000', type: 'fixed', val: 1000, min: 20000, uses: 52, expiry: '31 Dec 2026', status: 'Active' },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      Store.init();
      Admin.renderSidebar('coupons');
      Admin.renderTopbar();
      renderCoupons();
    });

    function renderCoupons() {
      const tbody = document.getElementById('coupons-tbody');
      tbody.innerHTML = INITIAL_COUPONS.map(c => `
        <tr>
          <td>
            <strong style="color: var(--admin-primary); font-family: monospace; font-size: 15px; letter-spacing: 0.5px;">${c.code}</strong>
          </td>
          <td>${c.type === 'percent' ? 'Percentage Discount' : 'Fixed Rupee Off'}</td>
          <td><strong>${c.type === 'percent' ? c.val + '%' : '₹' + c.val}</strong></td>
          <td>₹${c.min.toLocaleString('en-IN')}</td>
          <td><strong>${c.uses} redeemed</strong></td>
          <td>${c.expiry}</td>
          <td><span class="admin-badge badge-success">${c.status}</span></td>
          <td>
            <button class="admin-btn admin-btn-danger admin-btn-sm" onclick="alert('Coupon deactivated')">Disable</button>
          </td>
        </tr>
      `).join('');
    }

    function openAddCouponModal() {
      document.getElementById('coupon-modal').style.display = 'flex';
    }

    function handleCreateCoupon(e) {
      e.preventDefault();
      const code = document.getElementById('cpn-code').value.toUpperCase();
      const type = document.getElementById('cpn-type').value;
      const val = parseInt(document.getElementById('cpn-val').value, 10);
      const min = parseInt(document.getElementById('cpn-min').value, 10);

      INITIAL_COUPONS.unshift({
        code,
        type,
        val,
        min,
        uses: 0,
        expiry: '31 Dec 2026',
        status: 'Active'
      });

      document.getElementById('coupon-modal').style.display = 'none';
      renderCoupons();
      alert(`Promo code "${code}" is now live in store!`);
    }
  </script>
</body>
</html>
