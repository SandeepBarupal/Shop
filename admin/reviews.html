<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews Moderation — Royal Fairway Admin</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar" class="admin-topbar"></header>

    <main class="admin-content">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Player Reviews &amp; Ratings Moderation</h1>
          <p class="admin-page-subtitle">Verify player feedback, manage ratings, and curate featured testimonials for the homepage.</p>
        </div>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Equipment Item</th>
              <th>Reviewer</th>
              <th>Score</th>
              <th>Review Feedback</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reviews-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="admin.js"></script>
  <script>
    const INITIAL_REVIEWS = [
      {
        product: 'TaylorMade Qi10 LS Driver (9.0°)',
        reviewer: 'Col. Alok Sharma (Retd.)',
        handicap: 'Handicap 6.8 • DGC',
        rating: 5,
        title: 'Gained 14 yards off the tee at Delhi Golf Club',
        comment: 'The 10K MOI stability is noticeable on toe strikes. White-Glove delivery was on time with custom shaft sleeve intact.',
        date: '12 Nov 2026',
        status: 'Approved'
      },
      {
        product: 'Scotty Cameron Special Select Newport 2',
        reviewer: 'Dr. Siddharth Nambiar',
        handicap: 'Handicap 9.2 • KGA Bengaluru',
        rating: 5,
        title: 'Milled precision like no other putter',
        comment: 'Pure feel off the solid milled face. Worth every rupee for the roll consistency.',
        date: '10 Nov 2026',
        status: 'Featured'
      },
      {
        product: 'Titleist Pro V1 Tour Golf Balls (Dozen)',
        reviewer: 'Rohit Talwar',
        handicap: 'Handicap 14.1 • Prestige Golfshire',
        rating: 5,
        title: 'The gold standard for approach control',
        comment: 'Drop-and-stop control on elevated greens. Delivered in pristine factory sleeves.',
        date: '08 Nov 2026',
        status: 'Approved'
      },
      {
        product: 'FootJoy Premiere Series Wilcox Tour Shoes',
        reviewer: 'Capt. Vikram Mehra',
        handicap: 'Handicap 11.5 • DLF Phase 5',
        rating: 4,
        title: 'Classic styling and incredible comfort',
        comment: 'Driver allowed me to test fit the UK 9 and UK 9.5 right at my front door. Flawless concierge service.',
        date: '05 Nov 2026',
        status: 'Approved'
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      Store.init();
      Admin.renderSidebar('reviews');
      Admin.renderTopbar();
      renderReviews();
    });

    function renderReviews() {
      const tbody = document.getElementById('reviews-tbody');
      tbody.innerHTML = INITIAL_REVIEWS.map(r => `
        <tr>
          <td>
            <strong>${r.product}</strong>
          </td>
          <td>
            <strong>${r.reviewer}</strong><br>
            <span style="font-size: 11.5px; color: var(--admin-text-muted);">${r.handicap}</span>
          </td>
          <td>
            <strong style="color: var(--admin-gold); font-size: 15px;">★ ${r.rating}.0</strong>
          </td>
          <td style="max-width: 320px;">
            <div style="font-weight: 700; font-size: 13.5px; margin-bottom: 2px;">"${r.title}"</div>
            <div style="font-size: 12.5px; color: var(--admin-text-muted); line-height: 1.4;">${r.comment}</div>
          </td>
          <td><span style="font-size: 12px;">${r.date}</span></td>
          <td>
            <span class="admin-badge ${r.status === 'Featured' ? 'badge-gold' : 'badge-success'}">${r.status}</span>
          </td>
          <td>
            <div style="display: flex; gap: 6px;">
              <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="alert('Review pinned to homepage!')">Feature</button>
              <button class="admin-btn admin-btn-danger admin-btn-sm" onclick="alert('Review removed')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
