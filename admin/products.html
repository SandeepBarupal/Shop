<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management — Royal Fairway Admin</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar" class="admin-topbar"></header>

    <main class="admin-content">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Tour Equipment &amp; Product Catalog</h1>
          <p class="admin-page-subtitle">Manage championship golf equipment, price tags, and inventory stocks.</p>
        </div>

        <button class="admin-btn admin-btn-primary" onclick="openAddProductModal()">
          + Add New Golf Product
        </button>
      </div>

      <!-- Filters Row -->
      <div class="admin-card" style="padding: 18px 24px; margin-bottom: 20px;">
        <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
          <input type="text" id="prod-filter-search" class="admin-input" style="width: 280px;" placeholder="Filter by product name or brand..." oninput="filterProductList()">

          <select id="prod-filter-category" class="admin-select" style="width: 200px;" onchange="filterProductList()">
            <option value="all">All Categories</option>
            <option value="clubs">Golf Clubs</option>
            <option value="drivers">Drivers</option>
            <option value="irons">Irons</option>
            <option value="putters">Putters</option>
            <option value="balls">Golf Balls</option>
            <option value="bags">Golf Bags</option>
            <option value="shoes">Shoes</option>
            <option value="apparel">Apparel</option>
            <option value="tech">Tech &amp; GPS</option>
          </select>

          <select id="prod-filter-condition" class="admin-select" style="width: 180px;" onchange="filterProductList()">
            <option value="all">All Conditions</option>
            <option value="New">New (Box Pack)</option>
            <option value="Pre-Owned">Certified Pre-Owned</option>
          </select>

          <span class="text-muted" id="prod-count-text" style="font-size: 13px; margin-left: auto;">Showing products</span>
        </div>
      </div>

      <!-- Products Table -->
      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Brand</th>
              <th>Category</th>
              <th>Condition</th>
              <th>Price (₹)</th>
              <th>MRP (₹)</th>
              <th>Rating</th>
              <th>Stock Actions</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add Product Modal -->
  <div id="add-product-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #ffffff; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: var(--admin-radius); padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-size: 20px;">Add New Golf Club or Gear</h3>
        <button onclick="closeAddProductModal()" style="font-size: 20px; border: none; background: none; cursor: pointer;">✕</button>
      </div>

      <form id="new-product-form" onsubmit="handleCreateProduct(event)">
        <div class="admin-form-group">
          <label class="admin-label">Product Name / Title *</label>
          <input type="text" id="p-name" class="admin-input" required placeholder="e.g. TaylorMade Qi10 Max Driver">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="admin-form-group">
            <label class="admin-label">Brand *</label>
            <select id="p-brand" class="admin-select">
              <option>TaylorMade</option>
              <option>Titleist</option>
              <option>Callaway</option>
              <option>Scotty Cameron</option>
              <option>Ping</option>
              <option>Mizuno</option>
              <option>FootJoy</option>
              <option>Bushnell</option>
              <option>Vessel</option>
              <option>Garmin</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label class="admin-label">Category *</label>
            <select id="p-category" class="admin-select">
              <option value="clubs">Golf Clubs</option>
              <option value="drivers">Drivers</option>
              <option value="irons">Irons</option>
              <option value="putters">Putters</option>
              <option value="balls">Golf Balls</option>
              <option value="bags">Golf Bags</option>
              <option value="shoes">Shoes</option>
              <option value="apparel">Apparel</option>
              <option value="tech">Tech &amp; GPS</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="admin-form-group">
            <label class="admin-label">Store Price (₹) *</label>
            <input type="number" id="p-price" class="admin-input" required placeholder="64999">
          </div>

          <div class="admin-form-group">
            <label class="admin-label">Original MRP (₹) *</label>
            <input type="number" id="p-mrp" class="admin-input" required placeholder="74999">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="admin-form-group">
            <label class="admin-label">Condition *</label>
            <select id="p-condition" class="admin-select">
              <option value="New">New (Factory Sealed)</option>
              <option value="10/10 Mint">10/10 Mint (Like New)</option>
              <option value="9/10 Excellent">9/10 Excellent</option>
              <option value="8/10 Very Good">8/10 Very Good</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label class="admin-label">Initial Stock Quantity</label>
            <input type="number" id="p-stock" class="admin-input" value="12">
          </div>
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Image URL *</label>
          <input type="url" id="p-image" class="admin-input" required value="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=800&q=80">
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Description &amp; Tour Specs</label>
          <textarea id="p-desc" class="admin-textarea" rows="3" placeholder="Championship golf club engineered for maximum MOI and fairway forgiveness."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
          <button type="button" class="admin-btn admin-btn-outline" onclick="closeAddProductModal()">Cancel</button>
          <button type="submit" class="admin-btn admin-btn-primary">Add Product to Store</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Store.init();
      Admin.renderSidebar('products');
      Admin.renderTopbar();
      renderProductsTable();
    });

    function renderProductsTable(items) {
      const list = items || Store.getProducts();
      document.getElementById('prod-count-text').textContent = `Showing ${list.length} products`;

      const tbody = document.getElementById('products-tbody');
      tbody.innerHTML = list.map(prod => `
        <tr>
          <td>
            <div style="display: flex; gap: 12px; align-items: center;">
              <img src="${prod.image}" style="width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--admin-border);">
              <div>
                <strong>${prod.name}</strong><br>
                <span style="font-size: 11.5px; color: var(--admin-text-muted);">${prod.id}</span>
              </div>
            </div>
          </td>
          <td><strong>${prod.brand}</strong></td>
          <td><span class="admin-badge badge-info">${prod.category}</span></td>
          <td>
            <span class="admin-badge ${prod.condition === 'New' ? 'badge-success' : 'badge-gold'}">
              ${prod.condition || 'New'}
            </span>
          </td>
          <td><strong>₹${prod.price.toLocaleString('en-IN')}</strong></td>
          <td><span style="color: var(--admin-text-muted); text-decoration: line-through;">₹${prod.mrp.toLocaleString('en-IN')}</span></td>
          <td>★ ${prod.rating} (${prod.reviewsCount})</td>
          <td>
            <div style="display: flex; gap: 6px;">
              <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="editProduct('${prod.id}')">Edit</button>
              <button class="admin-btn admin-btn-danger admin-btn-sm" onclick="deleteProduct('${prod.id}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterProductList() {
      const q = document.getElementById('prod-filter-search').value.toLowerCase().trim();
      const cat = document.getElementById('prod-filter-category').value;
      const cond = document.getElementById('prod-filter-condition').value;

      let list = Store.getProducts();

      if (q) {
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
      }
      if (cat !== 'all') {
        list = list.filter(p => p.category === cat);
      }
      if (cond === 'New') {
        list = list.filter(p => !p.condition || p.condition === 'New');
      } else if (cond === 'Pre-Owned') {
        list = list.filter(p => p.condition && p.condition !== 'New');
      }

      renderProductsTable(list);
    }

    function openAddProductModal() {
      document.getElementById('add-product-modal').style.display = 'flex';
    }

    function closeAddProductModal() {
      document.getElementById('add-product-modal').style.display = 'none';
    }

    function handleCreateProduct(e) {
      e.preventDefault();
      const newProd = {
        name: document.getElementById('p-name').value,
        brand: document.getElementById('p-brand').value,
        category: document.getElementById('p-category').value,
        price: parseInt(document.getElementById('p-price').value, 10),
        mrp: parseInt(document.getElementById('p-mrp').value, 10),
        condition: document.getElementById('p-condition').value,
        image: document.getElementById('p-image').value,
        description: document.getElementById('p-desc').value,
      };

      Store.addProduct(newProd);
      closeAddProductModal();
      renderProductsTable();
    }

    function deleteProduct(id) {
      if (confirm('Are you sure you wish to delete this product from the live catalog?')) {
        Store.deleteProduct(id);
        renderProductsTable();
      }
    }

    function editProduct(id) {
      const prod = Store.getProductById(id);
      if (!prod) return;
      const newPrice = prompt(`Enter new price in ₹ for "${prod.name}":`, prod.price);
      if (newPrice && !isNaN(newPrice)) {
        Store.updateProduct(id, { price: parseInt(newPrice, 10) });
        renderProductsTable();
      }
    }
  </script>
</body>
</html>
