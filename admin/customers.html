<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer CRM — Royal Fairway Admin</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar" class="admin-topbar"></header>

    <main class="admin-content">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Clubhouse Member CRM</h1>
          <p class="admin-page-subtitle">Player profiles, home golf course affiliations, VIP membership tiers, and lifetime spending.</p>
        </div>

        <button class="admin-btn admin-btn-gold" onclick="alert('Exported Clubhouse Member Roster (CSV) successfully!')">
          Export Member CSV
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h3 style="font-size: 16px;">Registered Clubhouse Members</h3>
          <span style="font-size: 12.5px; color: var(--admin-text-muted);">Verified golf club players across India</span>
        </div>

        <table class="admin-table">
          <thead>
            <tr>
              <th>Member Name</th>
              <th>Home Golf Course</th>
              <th>Contact Details</th>
              <th>Clubhouse Tier</th>
              <th>Total Orders</th>
              <th>Lifetime Spend</th>
              <th>Reward Points</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="customers-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="admin.js"></script>
  <script>
    const MEMBERS_CRM = [
      {
        name: 'Major General Ranvijay Singh',
        club: 'DLF Golf & Country Club, Gurugram',
        email: 'ranvijay.singh@example.com',
        phone: '+91 98100 23456',
        tier: 'Eagle VIP',
        ordersCount: 4,
        spend: 284999,
        points: 2450,
      },
      {
        name: 'Capt. Vikramaditya Rathore',
        club: 'Delhi Golf Club (DGC)',
        email: 'vikram.rathore@example.com',
        phone: '+91 98101 88421',
        tier: 'Birdie Member',
        ordersCount: 2,
        spend: 114999,
        points: 1200,
      },
      {
        name: 'Aditya Birla Mehra',
        club: 'Karnataka Golf Association (KGA Bengaluru)',
        email: 'aditya.mehra@example.com',
        phone: '+91 99801 77312',
        tier: 'Eagle VIP',
        ordersCount: 5,
        spend: 349000,
        points: 4100,
      },
      {
        name: 'Ananya Singhania',
        club: 'Bombay Presidency Golf Club (BPGC)',
        email: 'ananya.s@example.com',
        phone: '+91 98202 44910',
        tier: 'Birdie Member',
        ordersCount: 3,
        spend: 89000,
        points: 890,
      },
      {
        name: 'Rohit Talwar',
        club: 'Prestige Golfshire, Bengaluru',
        email: 'rohit.talwar@example.com',
        phone: '+91 98450 11992',
        tier: 'Par Member',
        ordersCount: 1,
        spend: 24999,
        points: 250,
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      Store.init();
      Admin.renderSidebar('customers');
      Admin.renderTopbar();

      const tbody = document.getElementById('customers-tbody');
      tbody.innerHTML = MEMBERS_CRM.map(m => `
        <tr>
          <td>
            <strong>${m.name}</strong>
          </td>
          <td>
            <span style="font-size: 13px; color: var(--admin-primary); font-weight: 600;">⛳ ${m.club}</span>
          </td>
          <td>
            <div style="font-size: 13px;">${m.email}</div>
            <div style="font-size: 12px; color: var(--admin-text-muted);">${m.phone}</div>
          </td>
          <td>
            <span class="admin-badge ${m.tier.includes('Eagle') ? 'badge-gold' : m.tier.includes('Birdie') ? 'badge-success' : 'badge-info'}">
              ${m.tier}
            </span>
          </td>
          <td><strong>${m.ordersCount} Dispatches</strong></td>
          <td><strong>₹${m.spend.toLocaleString('en-IN')}</strong></td>
          <td><strong style="color: var(--admin-gold);">${m.points.toLocaleString('en-IN')} pts</strong></td>
          <td>
            <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="alert('Awarded +500 Reward Points to ${m.name}!')">+ Add Pts</button>
          </td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
